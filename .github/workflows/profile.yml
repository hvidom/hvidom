name: Refresh profile

on:
  schedule:
    - cron: "23 4 * * *" # every night, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/stats.mjs"
      - "scripts/lib.mjs"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Space shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: assets/generated/space-shooter.webp
          fps: 30
          no-commit: true

      - name: Telemetry card
        run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One rolling bot commit instead of a new one every night.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          msg="chore: refresh generated profile assets"
          if [ "$(git log -1 --format=%s)" = "$msg" ] && [ "$(git log -1 --format=%ae)" = "41898282+github-actions[bot]@users.noreply.github.com" ]; then
            git commit --amend -m "$msg"
            git push --force-with-lease
          else
            git commit -m "$msg"
            git push
          fi
